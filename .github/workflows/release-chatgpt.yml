name: Release (ChatGPT)

# The ChatGPT package is built from core/ by scripts/build.py and committed under
# plugins/llm-wiki-chatgpt, because ChatGPT installs it from .agents/plugins/marketplace.json: a
# workspace admin imports this repository once (Admin > Plugins > Import marketplace).
#
# To cut a release: bump "version" in platforms/chatgpt/files/plugin.json, add an entry to
# platforms/chatgpt/CHANGELOG.md, run `python3 scripts/build.py chatgpt`, commit, then:
#     git tag chatgpt-v0.3.0 && git push origin chatgpt-v0.3.0
#
# Releases are never marked "latest", so /releases/latest keeps pointing at the Claude plugin.

on:
  push:
    tags: ["chatgpt-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the ChatGPT version
        run: |
          TAG="${GITHUB_REF_NAME#chatgpt-v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('platforms/chatgpt/files/plugin.json'))['version'])")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match platforms/chatgpt/files/plugin.json ($MANIFEST)."
            exit 1
          fi

      - name: Check the committed package matches core/
        run: python3 scripts/build.py chatgpt --check

      - name: Build the zip
        run: |
          mkdir -p dist staging
          cp -R plugins/llm-wiki-chatgpt staging/llm-wiki
          cp README.md LICENSE staging/llm-wiki/
          cp platforms/chatgpt/CHANGELOG.md staging/llm-wiki/CHANGELOG.md
          if find staging -name 'CLAUDE.md' -o -name '.claude*' -o -name '.specify' -o -name 'speckit-*' | grep -q .; then
            echo "::error::Claude or development files leaked into the ChatGPT zip"; exit 1
          fi
          (cd staging && zip -rq "../dist/llm-wiki-${GITHUB_REF_NAME}.zip" llm-wiki -x '*.DS_Store')
          unzip -l dist/*.zip | tail -3

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          make_latest: false
          name: LLM Wiki for ChatGPT ${{ github.ref_name }}
          body: |
            **LLM Wiki for ChatGPT.** Install it from your company's ChatGPT plugin directory: a workspace
            admin imports this repository once (Admin → Plugins → Add → Import marketplace), then everyone
            adds LLM Wiki from Plugins. Setup: https://github.com/mauricio-morales/llm-wiki/blob/main/docs/setup-chatgpt.md

            The zip is the same package, for reference. What changed: platforms/chatgpt/CHANGELOG.md.
            The Claude plugin is released separately, under `v*` tags.
